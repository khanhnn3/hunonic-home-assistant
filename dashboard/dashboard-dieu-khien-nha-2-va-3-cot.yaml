              rows: auto
      # ===== Nhà khác =====
      - type: grid
        cards:
          - type: heading
            heading: Nhà khác
            icon: mdi:home-group
          - type: custom:mushroom-template-card
            entity: switch.den_ong
            primary: Đèn ống
            secondary: "{{ 'Đang bật' if is_state('switch.den_ong', 'on') else ('Đang tắt' if is_state('switch.den_ong', 'off') else 'Mất kết nối') }}"
            icon: mdi:lightbulb-fluorescent-tube
            icon_color: "{{ 'green' if is_state('switch.den_ong', 'on') else 'grey' }}"
            layout: vertical
