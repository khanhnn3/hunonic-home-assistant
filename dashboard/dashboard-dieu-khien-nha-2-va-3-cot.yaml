          - type: custom:mushroom-template-card
            entity: switch.den_2_nha_k2
            primary: Đèn 2 Nhà K2
            secondary: "{{ 'Đang bật' if is_state('switch.den_2_nha_k2', 'on') else ('Đang tắt' if is_state('switch.den_2_nha_k2', 'off') else 'Mất kết nối') }}"
